[package]
name = "wallet8-holder"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wallet8-dev/wallet8-holder"
rust-version = "1.85"
description = "Wallet8 Holder - the encrypted credential vault: stored credentials (secret-reference-only), device-key registration, presentation history, status checks."

[[bin]]
name = "wallet8-holder"
path = "src/main.rs"

[lib]
name = "wallet8_holder_server"
path = "src/lib.rs"

[dependencies]
# Platform SDK pin (RS 2.3) - the only cross-repo platform dependency.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v1.1.2" }
# wallet8 namespace facade pin - the wallet clients + contracts
# (the dev-tree [patch] below overrides this with the local SDK
# workspace until the wallet8-v1.0.1 tag ships).
wallet8 = { git = "https://github.com/Wallet8-dev/wallet8-sdk", tag = "wallet8-v1.1.1" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
# The attester self-check: the x5c leaf parse (SPKI extraction).
x509-parser = "0.16"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros"] }
valkey-glide = "0.9.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdsa-core", "pem"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider"], default-features = false }
utoipa = { version = "5", features = ["chrono", "uuid"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# The dev-tree override: the local SDK workspace patches the
# published pin (the release flow re-tags + drops this section;
# consumers always resolve the git tag above).
[patch."https://github.com/Wallet8-dev/wallet8-sdk"]
wallet8 = { path = "../wallet8-sdk/facade" }
wallet8-oid4vci-client = { path = "../wallet8-sdk/crates/oid4vci-client" }
wallet8-oid4vp-client = { path = "../wallet8-sdk/crates/oid4vp-client" }
wallet8-holder-contracts = { path = "../wallet8-sdk/crates/holder-contracts" }
